version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sifap-postgres
    environment:
      POSTGRES_DB: sifap
      POSTGRES_USER: sifap
      POSTGRES_PASSWORD: sifap_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sifap -d sifap"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: sifap-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sifap
      SPRING_DATASOURCE_USERNAME: sifap
      SPRING_DATASOURCE_PASSWORD: sifap_dev_only
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: sifap-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  postgres_data:
